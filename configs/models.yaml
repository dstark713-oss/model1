models:
  tp:
    iterations: 500
    depth: 6
    learning_rate: 0.05
    l2_leaf_reg: 3.0
    min_data_in_leaf: 20
    loss_function: "Logloss"
    eval_metric: "Logloss"
    random_seed: 42
    verbose: false
    allow_writing_files: false
  sl:
    iterations: 500
    depth: 6
    learning_rate: 0.05
    l2_leaf_reg: 3.0
    min_data_in_leaf: 20
    loss_function: "Logloss"
    eval_metric: "Logloss"
    random_seed: 42
    verbose: false
    allow_writing_files: false

calibration:
  method: "isotonic"

persistence:
  models_dir: "artifacts/models"
  latest_file: "latest.json"